# Publishes the website to GitHub Pages from main, and only from main.
#
# - Every change merged into main is published within a few minutes.
# - Every hour the site is rebuilt as well, so pages built in advance carry the latest
#   content saved in the admin area (the live content always loads on top anyway).
# - It can also be started by hand: Actions > Publish site > Run workflow.
#
# Nothing is published from anyone's own computer any more: one source, one way.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer one waits for the one running.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (pages are pre-built with the current content from the database)
        run: npm run build

      - name: Keep the previous release's files for visitors who still have it open
        run: node scripts/keep-previous-assets.mjs

      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --nojekyll: the site is already built, so GitHub Pages serves the files as they are.
          # Without it GitHub runs its own Jekyll step over them, which can fail and leave the
          # previous version live (it did on 23 Nov).
          npx gh-pages -d dist --nojekyll \
            -m "Publish from main (${GITHUB_SHA::7}, ${{ github.event_name }})" \
            -r "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
