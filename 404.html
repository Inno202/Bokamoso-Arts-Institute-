<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect 404s back to root with query string for spa-github-pages
      var l = window.location;
      var pathSegmentsToKeep = l.hostname.includes('github.io') ? 1 : 0;
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var restPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/?/' + restPath +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        (l.hash ? '&h=' + l.hash.slice(1) : '')
      );
    </script>
  </head>
  <body>
  </body>
</html>
