    <title>Bokamoso Arts Institute | Choral excellence from Mabopane</title>

    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%assets/brand/favicon-white-192.png" />

    <meta name="apple-mobile-web-app-title" content="BAI" />

    <link rel="preconnect" href="https://content-firebaseappcheck.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" />
